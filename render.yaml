services:
  - type: web
    name: items-scraper-backend
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard
      - key: DATABASE_NAME
        value: dealhunter
      - key: SCRAPER_CRON_INTERVAL_MINUTES
        value: "360"
      - key: FRONTEND_URL
        sync: false          # set to your Vercel URL e.g. https://yourapp.vercel.app
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false          # set manually in Render dashboard
      - key: EMAIL_PASSWORD
        sync: false          # set manually in Render dashboard
      - key: EMAIL_FROM
        sync: false          # set manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.12.7"
    healthCheckPath: /health
